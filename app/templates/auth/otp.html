<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email · CCSICT</title><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/workspace.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/srs.css') }}"></head>
<body class="auth-body"><main class="login-wrap"><img class="login-logo" src="{{ url_for('static',filename='img/logo.png') }}" alt="CCSICT"><h1>Check your email</h1><p>Enter the six-digit code sent to {{ session.otp_address }}. It expires in five minutes.</p>
{% for category,message in get_flashed_messages(with_categories=true) %}<p class="auth-flash {{ category }}" role="alert">{{ message }}</p>{% endfor %}
<form method="post" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="login-field"><label for="otp">Email code</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></div><button class="login-submit">Verify and sign in</button></form>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="resend"><button class="btn btn-outline" type="submit">Resend code</button><p class="muted">Wait 60 seconds between requests.</p></form><a href="{{ url_for('auth.select_role') }}">Back to sign in</a></main></body></html>
