<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change temporary password</title><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/workspace.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/srs.css') }}"></head><body class="auth-body"><main class="login-wrap"><h1 class="login-title">Set your own password</h1><p class="login-subtitle">Replace your temporary password before opening the portal.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="auth-flash {{ category }}">{{ message }}</div>{% endfor %}<form method="post" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="login-field"><label for="current">Temporary password</label><input id="current" name="current_password" type="password" autocomplete="current-password" data-password-toggle="inside" required></div><div class="login-field"><label for="new">New password</label><input id="new" name="new_password" type="password" minlength="8" autocomplete="new-password" data-password-toggle="inside" required>{% include '_password_requirements.html' %}</div><div class="login-field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm_password" type="password" minlength="8" autocomplete="new-password" data-password-toggle="inside" required></div><button class="login-submit">Save password</button></form><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-action">Sign out</button></form></main><script src="{{ url_for('static',filename='js/workspace.js') }}" defer></script><script src="{{ url_for('static',filename='js/forms.js') }}" defer></script></body></html>
